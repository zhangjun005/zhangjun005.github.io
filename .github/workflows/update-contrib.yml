name: update contributions

on:
  # 每天 00:30 UTC = 北京时间 08:30
  schedule:
    - cron: '30 0 * * *'
  # 也可以在 Actions 页面手动点「Run workflow」
  workflow_dispatch:
  # 首次推送本文件时自动跑一次，方便验证
  push:
    paths:
      - '.github/workflows/update-contrib.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: update-contrib
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: regenerate contribution graph & activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-contrib.mjs

      - name: commit if changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "数据没有变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: 更新贡献图与最近活动"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 提交本身会触发 Pages 构建；这里再显式请求一次作为兜底。
      # 失败不影响主流程（continue-on-error），页面仍会由上面的提交构建。
      - name: request pages build
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -w '\nHTTP %{http_code}\n' \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
